name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp verify
      # release build scoped to the published modules morimail and morimail-html: an unattached test-jar breaks a full-reactor release build, so morimail-html's release profile skips its tests (the verify step above ran them)
      - run: ./mvnw -B -ntp -Prelease clean verify -Dgpg.skip -pl morimail,morimail-html -am
      # REPO-08: the same build with no network at all: a fresh network namespace with only loopback up, Maven offline on the warmed cache, run as the runner user (sudo only creates the namespace)
      - run: sudo --preserve-env=HOME,JAVA_HOME unshare --net sh -c "ip link set lo up && exec setpriv --reuid=$(id -u) --regid=$(id -g) --init-groups ./mvnw -B -ntp -o verify"
