name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp verify
      # release build scoped to the published modules: an unattached test-jar breaks a full-reactor release build
      - run: ./mvnw -B -ntp -Prelease clean verify -Dgpg.skip -pl morimail -am
      # warmed-cache check that Maven needs no remote resolution, not network isolation
      - run: ./mvnw -B -ntp -o verify
