# The development account for the serial-mail sample. Use a test tenant and a test app
# registration only, never production credentials.
#
# Every ${NAME} is read from the environment. The MORIMAIL_DEV_* variables are listed in the
# root .env.sample; load a filled-in copy with: set -a; . ./.env; set +a
# The keys ending in Env name environment variables, so no secret is written here.
account.id=entra-dev
tenantId=${MORIMAIL_DEV_TENANT_ID}
clientId=${MORIMAIL_DEV_CLIENT_ID}
from=${MORIMAIL_DEV_FROM}
certificate.path=${MORIMAIL_DEV_CERT_PATH}
certificate.passwordEnv=MORIMAIL_DEV_CERT_PASSWORD
# or, in place of the two certificate lines:
# secretEnv=MORIMAIL_DEV_SECRET
