# An example account for the serial-mail sample.
# Every value is an example: example.com addresses and all-zero GUIDs, never a real tenant.
# Secrets are never written here; the keys ending in Env name environment variables.
# Use forward slashes in paths, because a backslash starts an escape in .properties files.
account.id=entra-main
tenantId=00000000-0000-0000-0000-000000000000
clientId=00000000-0000-0000-0000-000000000000
from=newsletter@example.com
certificate.path=/path/app.p12
certificate.passwordEnv=MAIL_CERT_PASSWORD
# or, in place of the two certificate lines:
# secretEnv=MAIL_CLIENT_SECRET
